name: Daily educational open-source fork

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: Africa/Casablanca
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: "Only inspect a candidate; do not create a fork"
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: one-educational-fork-per-day
  cancel-in-progress: false

jobs:
  curator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm script works (unit tests)
        run: python -m unittest discover -s tests -v
      - name: Try one attributed public fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python scripts/daily_fork.py
      - name: Save the verified fork in learning library
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fork_history.json LIBRARY.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: index verified educational fork"
            git push
          fi
