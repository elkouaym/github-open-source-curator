name: Daily Open Source Forks

on:
  schedule:
    - cron: '13 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-source-fork
  cancel-in-progress: false

jobs:
  choose-and-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout curator repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find one project and fork it
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
          GITHUB_OWNER: elkouaym
        run: python scripts/daily_fork.py
      - name: Save educational library and avoid repeats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fork_history.json LIBRARY.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: index new educational fork'
            git push
          fi
